<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>아침간편식 출석 확인기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;background:#f4f5f7;color:#1a1a1a}
body{display:flex;flex-direction:column}
header{background:#1f3864;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .date{font-size:13px;opacity:.85}
header .sp{flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);
  border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer}
header button:active{background:rgba(255,255,255,.3)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;transition:background .15s}
#stage.ok{background:#e4f5ec}#stage.dup{background:#fdf3dd}
#stage.bad{background:#fbe6e6}#stage.out{background:#fbe6e6}
.card{text-align:center;max-width:640px;width:100%}
.mark{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;color:#fff;
  font-size:54px;line-height:96px;font-weight:700}
.ok .mark{background:#1d9e75}.dup .mark{background:#ba7517}
.bad .mark{background:#c0392b}.out .mark{background:#c0392b}
.name{font-size:58px;font-weight:700;margin:0 0 8px;line-height:1.1}
.sub{font-size:22px;color:#4a4a4a;margin:0 0 14px}
.msg{font-size:26px;font-weight:600}
.ok .msg{color:#0f6e56}.dup .msg{color:#854f0b}.bad .msg,.out .msg{color:#a32d2d}
.allergy{margin-top:16px;display:inline-block;background:#fff2cc;color:#c00000;
  border:2px solid #e0a800;border-radius:10px;padding:10px 18px;font-size:24px;font-weight:700}
.idle{color:#6b7280;font-size:26px}
.idle b{display:block;font-size:20px;margin-top:10px;color:#9aa0a6;font-weight:400}
footer{background:#fff;border-top:1px solid #dfe1e5;padding:8px 14px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
footer .cnt{font-size:15px;font-weight:700;color:#1f3864}
footer .cnt span{color:#6b7280;font-weight:400;font-size:13px}
footer button{background:#eef1f6;border:1px solid #c9ced8;border-radius:6px;
  padding:7px 12px;font-size:13px;cursor:pointer}
footer button:active{background:#dfe4ec}
#manual{border:1px solid #c9ced8;border-radius:6px;padding:7px 10px;font-size:15px;width:110px}
#log{max-height:150px;overflow:auto;background:#fff;border-top:1px solid #dfe1e5;
  font-size:13px;display:none}
#log.show{display:block}
#log div{padding:5px 14px;border-bottom:1px solid #f0f1f3;display:flex;gap:10px}
#log .t{color:#9aa0a6;width:62px;flex:none}
#log .n{font-weight:600;width:80px;flex:none}
#log .c{color:#6b7280}
#cam{display:none;width:100%;max-width:420px;border-radius:10px;background:#000}
#cam.show{display:block}
.hint{font-size:12px;color:#6b7280;padding:6px 14px;background:#fff}
#lock{position:fixed;inset:0;background:#1f3864;color:#fff;display:flex;
  align-items:center;justify-content:center;z-index:50;padding:20px}
#lock.off{display:none}
#lock .box{width:100%;max-width:380px;text-align:center}
#lock h2{font-size:22px;margin:0 0 6px;font-weight:600}
#lock p{font-size:14px;opacity:.8;margin:0 0 22px;line-height:1.5}
#lock input{width:100%;padding:14px;font-size:20px;text-align:center;border:none;
  border-radius:8px;margin-bottom:12px}
#lock button{width:100%;padding:14px;font-size:17px;font-weight:600;border:none;
  border-radius:8px;background:#f0c040;color:#1f3864;cursor:pointer}
#lock button:disabled{opacity:.5}
#lock .err{color:#ffc9c9;font-size:14px;min-height:20px;margin-top:12px}
#lock .ver{font-size:12px;opacity:.6;margin-top:26px}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <h2>아침간편식 출석 확인기</h2>
  <p>순천팔마중학교<br>담당 선생님께 받은 비밀번호를 입력하세요.</p>
  <input id="pw" type="password" inputmode="text" placeholder="비밀번호" autocomplete="off">
  <button id="unlock">열기</button>
  <div class="err" id="err"></div>
  <div class="ver" id="verLock"></div>
</div></div>

<header>
  <h1>아침간편식 출석 확인기</h1>
  <span class="date" id="today"></span>
  <span class="date" id="ver" style="opacity:.6"></span>
  <span class="sp"></span>
  <button id="camBtn">카메라 스캔</button>
  <button id="logBtn">기록 보기</button>
</header>

<div id="stage">
  <div class="card" id="card">
    <video id="cam" playsinline muted></video>
    <div class="idle" id="idle">카드를 스캔하세요
      <b>스캐너로 찍거나, 아래 칸에 5자리 번호를 입력하고 Enter</b></div>
  </div>
</div>

<div id="log"></div>
<div class="hint" id="hint"></div>

<footer>
  <span class="cnt" id="cnt">0명 <span>/ 명단 0명</span></span>
  <input id="manual" inputmode="numeric" placeholder="번호 입력" autocomplete="off">
  <button id="undo">마지막 취소</button>
  <button id="csv">CSV 내보내기</button>
  <button id="reset">오늘 기록 초기화</button>
</footer>

let R = null, TOTAL = 0;

const idle = document.getElementById('idle'), logEl = document.getElementById('log');

function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
document.getElementById('today').textContent = todayKey();

let rec = [];
const KEY = 'bf_' + todayKey();
try { rec = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { rec = []; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch(e){} }

/* ── 소리: 결과마다 다르게 ── */
let ac = null;
function tone(seq){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    let t = ac.currentTime;
    seq.forEach(([f,d,v]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = f < 300 ? 'square' : 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + d); t += d + 0.02;
    });
  }catch(e){}
}
const SOUND = {
  ok:  () => tone([[1320,0.10,0.25]]),                                  // 짧은 삑 (한 번)
  dup: () => tone([[880,0.10,0.25],[880,0.10,0.25]]),                   // 삑삑 (두 번)
  bad: () => tone([[200,0.30,0.35],[160,0.35,0.35]]),                   // 낮고 긴 경고음
  out: () => tone([[200,0.22,0.35],[160,0.22,0.35],[130,0.40,0.35]])    // 더 긴 경고음
};
if(navigator.vibrate){ SOUND._v = {ok:[40],dup:[40,60,40],bad:[300],out:[250,100,250,100,250]}; }

function show(kind, name, sub, msg, allergy){
  stage.className = kind;
  let h = '<video id="cam" playsinline muted class="' + (camOn?'show':'') + '"></video>';
  h += '<div class="mark">' + ({ok:'✓',dup:'!',bad:'✕',out:'✕'}[kind]) + '</div>';
  if(name) h += '<div class="name">' + name + '</div>';
  if(sub)  h += '<div class="sub">' + sub + '</div>';
  h += '<div class="msg">' + msg + '</div>';
  if(allergy) h += '<div class="allergy">알레르기 · ' + allergy + '</div>';
  card.innerHTML = h;
  reattachCam();
  SOUND[kind] && SOUND[kind]();
  if(navigator.vibrate && SOUND._v) navigator.vibrate(SOUND._v[kind]);
  clearTimeout(show._t);
  show._t = setTimeout(reset, kind === 'ok' ? 2200 : 4000);
}
function reset(){
  stage.className = '';
  card.innerHTML = '<video id="cam" playsinline muted class="' + (camOn?'show':'') + '"></video>' +
    '<div class="idle">카드를 스캔하세요<b>스캐너로 찍거나, 아래 칸에 5자리 번호를 입력하고 Enter</b></div>';
  reattachCam();
}

function handle(code){
  if(!R) return;
  code = String(code).trim();
  if(!code) return;
  const now = new Date().toTimeString().slice(0,8);
  const s = R[code];
  if(!s){
    show('bad','','코드 ' + code,'등록되지 않은 카드입니다');
    rec.push([now, code, '', '미등록']); save(); render(); return;
  }
  const [name, cls, allergy, excluded] = s;
  if(excluded){
    show('out', name, cls, '제외된 학생입니다 · 담당 선생님께 알려주세요');
    rec.push([now, code, name, '제외']); save(); render(); return;
  }
  if(rec.some(r => r[1] === code && r[3] === '출석')){
    show('dup', name, cls, '이미 받아갔습니다');
    return;
  }
  show('ok', name, cls, now.slice(0,5) + ' 출석 완료', allergy && allergy !== '없음' ? allergy : '');
  rec.push([now, code, name, '출석']); save(); render();
}

function render(){
  if(!R) return;
  const ok = rec.filter(r => r[3] === '출석').length;
  const bad = rec.filter(r => r[3] !== '출석').length;
  cntEl.innerHTML = ok + '명 <span>/ 명단 ' + TOTAL + '명' + (bad ? ' · 이상 ' + bad + '건' : '') + '</span>';
  logEl.innerHTML = rec.slice().reverse().map(r =>
    '<div><span class="t">' + r[0] + '</span><span class="n">' + (r[2] || '—') +
    '</span><span class="c">' + r[1] + ' · ' + r[3] + '</span></div>').join('');
}

/* ── 스캐너(키보드) 입력 ── */
let buf = '', bt = 0;
document.addEventListener('keydown', e => {
  if(e.target === manual) return;
  const t = Date.now();
  if(t - bt > 120) buf = '';
  bt = t;
  if(e.key === 'Enter'){ if(buf){ handle(buf); buf = ''; } e.preventDefault(); return; }
  if(e.key.length === 1) buf += e.key;
});
manual.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ handle(manual.value); manual.value = ''; }
});

/* ── 버튼 ── */
document.getElementById('logBtn').onclick = () => logEl.classList.toggle('show');
document.getElementById('undo').onclick = () => {
  if(!rec.length) return;
  const last = rec.pop(); save(); render();
  hint.textContent = '취소: ' + (last[2] || last[1]) + ' (' + last[0] + ')';
  setTimeout(() => hint.textContent = HINT, 3000);
};
document.getElementById('reset').onclick = () => {
  if(!confirm('오늘 기록 ' + rec.length + '건을 모두 지울까요?')) return;
  rec = []; save(); render(); reset();
};
document.getElementById('csv').onclick = () => {
  const rows = [['날짜','시각','코드','이름','구분']]
    .concat(rec.map(r => [todayKey(), r[0], r[1], r[2], r[3]]));
  const csv = '\uFEFF' + rows.map(r => r.map(v => '"' + v + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = '아침간편식_' + todayKey() + '.csv';
  a.click();
};

/* ── 카메라 스캔 (https 에서만 동작) ── */
let camOn = false, det = null, stream = null;
function reattachCam(){
  const v = document.getElementById('cam');
  if(v && stream){ v.srcObject = stream; v.play().catch(()=>{}); v.classList.add('show'); }
}
document.getElementById('camBtn').onclick = async () => {
  if(camOn){
    camOn = false; stream && stream.getTracks().forEach(t => t.stop()); stream = null;
    reset(); hint.textContent = HINT; return;
  }
  if(!('BarcodeDetector' in window)){
    hint.textContent = '이 브라우저는 카메라 스캔을 지원하지 않습니다. 스캐너나 번호 입력을 사용하세요.'; return;
  }
  if(!window.isSecureContext){
    hint.textContent = '카메라는 https 주소로 열었을 때만 켜집니다. 파일로 열면 스캐너·번호 입력만 됩니다.'; return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    det = new BarcodeDetector({formats:['qr_code']});
    camOn = true; reset();
    hint.textContent = '카메라 스캔 중 — 카드를 화면에 비추세요.';
    let last = '', lastT = 0;
    const loop = async () => {
      if(!camOn) return;
      const v = document.getElementById('cam');
      if(v && v.readyState === 4){
        try{
          const codes = await det.detect(v);
          if(codes.length){
            const val = codes[0].rawValue, t = Date.now();
            if(val !== last || t - lastT > 2500){ last = val; lastT = t; handle(val); }
          }
        }catch(e){}
      }
      setTimeout(loop, 250);
    };
    loop();
  }catch(e){ hint.textContent = '카메라를 열 수 없습니다: ' + e.message; }
};

const HINT = '스캐너로 찍으면 바로 반영됩니다 · 소리: 짧은 삑=정상, 삑삑=중복, 길고 낮은 소리=미등록·제외';
hint.textContent = HINT;

/* ── 비밀번호 잠금 (명단은 AES-GCM 으로 암호화되어 있습니다) ── */
document.getElementById('ver').textContent =
  '명단 ' + VER.d + ' 기준 · ' + VER.n + '명 · 제외 ' + VER.x + '명';
document.getElementById('verLock').textContent =
  '명단 기준일 ' + VER.d + '  ·  ' + VER.n + '명  ·  제외 ' + VER.x + '명';

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.n, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.i)}, key, b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(out));
}
const lock = document.getElementById('lock'), pw = document.getElementById('pw'),
      err = document.getElementById('err'), unlockBtn = document.getElementById('unlock');
async function tryUnlock(){
  if(!window.crypto || !crypto.subtle){
    err.textContent = '이 브라우저에서는 열 수 없습니다. 크롬으로 열어주세요.'; return;
  }
  unlockBtn.disabled = true; err.textContent = '여는 중…';
  try{
    R = await decrypt(pw.value.trim());
    TOTAL = Object.keys(R).length;
    try { sessionStorage.setItem('bf_pw', pw.value.trim()); } catch(e){}
    lock.classList.add('off');
    render(); manual.focus();
  }catch(e){
    R = null; err.textContent = '비밀번호가 맞지 않습니다.';
  }
  unlockBtn.disabled = false;
}
unlockBtn.onclick = tryUnlock;
pw.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
(function(){
  let saved = null;
  try { saved = sessionStorage.getItem('bf_pw'); } catch(e){}
  if(saved){ pw.value = saved; tryUnlock(); } else { pw.focus(); }
})();
</script>
